name: sync-strategies

# 飞书「已上架视图」→ strategies.json → 官网。
# 每天 02:00(UTC) 自动跑, 也可在 Actions 页面手动触发。
on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 北京 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 从飞书拉取已上架策略
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 scripts/sync_strategies.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- strategies.json; then
            echo "无变化, 跳过提交"
          else
            git add strategies.json
            git commit -m "chore: 同步策略广场 ($(date -u +%Y-%m-%d))"
            git push
          fi
